name: Release

# A tag `v<version>` publishes both packages at that version through npm trusted publishing (plan decision 22): a
# GitHub-hosted runner, Node 22, npm 11.5.1 or later, an OIDC token and no NODE_AUTH_TOKEN. The first version of each
# package is published by hand; this workflow takes over once each package has a trusted-publishing configuration for
# this repository and this file, with direct publishing switched on.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing and provenance

concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the previous tag, for the release notes
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # Fails when the tag does not match both packages' versions.
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      # A release ships the live document's shape: regenerate and commit first when this fails (plan decision 7).
      - run: npm run generate -- --check
      - run: npm run generate -- --offline --check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Publish @uniquedomains/sdk, then @uniquedomains/cli
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in sdk cli; do
            name="@uniquedomains/${package}"
            # A re-run after a partial publish skips what is already on the registry.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published."
            else
              npm publish --workspace "packages/${package}" --provenance --access public
            fi
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
