name: Release

# A tag `v<version>` publishes every package at that version through npm trusted publishing (plan decision 22): a
# GitHub-hosted runner, Node 22, npm 11.5.1 or later, an OIDC token and no NODE_AUTH_TOKEN. The first version of each
# package is a placeholder published by hand (scripts/publish-placeholder.mjs); this workflow takes over once each package has a trusted-publishing configuration for
# this repository and this file, with direct publishing switched on. A new configuration expires when no publish
# succeeds within two days, so add it only when the next tag is ready.
#
# Two jobs (review R1-18): `build` installs the dependencies and runs their scripts without any publish right; only
# `publish` can mint the OIDC token, and it installs nothing and runs no package script.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One group per tag: a third tag never cancels a waiting second one (review R1-18).
concurrency: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the previous tag, for the release notes
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails when the tag does not match every package's version, or carries a pre-release (review R1-4).
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      # A release ships the live document's shape: regenerate and commit first when this fails (plan decision 7).
      - run: npm run generate -- --check
      - run: npm run generate -- --offline --check
      - run: npm run check:text
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:pack
      - uses: actions/upload-artifact@v4
        with:
          name: release
          if-no-files-found: error
          path: |
            release-notes.md
            packages/*/dist
            packages/*/LICENSE
            packages/sdk/openapi.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - name: Publish @uniquedomains/sdk, then every other package
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in $(node scripts/list-packages.mjs); do
            name="@uniquedomains/${package}"
            # A re-run after a partial publish skips what is already on the registry.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published."
              continue
            fi
            # The build job built `dist`; --ignore-scripts keeps `prepack` from running a build here.
            if ! output="$(npm publish --workspace "packages/${package}" --provenance --access public --ignore-scripts 2>&1)"; then
              echo "$output"
              # The registry's read side can lag a fresh publish by a minute or more: a version published by hand just
              # before the tag is not yet seen by `npm view` and is refused here. That refusal means the version is out, so it is a
              # skip, not a failure (v0.1.0 of 2026-11-09, review N5). Any other refusal fails the job.
              if grep -qi "cannot publish over the previously published versions" <<<"$output"; then
                echo "${name}@${version} was already published (the registry had not shown it yet)."
                continue
              fi
              exit 1
            fi
            echo "$output"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
